services:
  account_db:
    container_name: account_db
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - account_db_data:/var/lib/postgresql/data

  adminer_panel:
    container_name: account_adminer_panel
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - account_db

  account_app:
    container_name: account_app
    image: account_app
    restart: unless-stopped
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["sh", "./start.sh"]
    depends_on:
      - account_db

volumes:
  account_db_data: